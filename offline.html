<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#22c55e">
<title>Sin conexión — Canchas El Campeón</title>
<link rel="icon" href="/icons/icon-192.svg">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f1117;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #1a1f2e;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 40px 28px;
    text-align: center;
    max-width: 360px;
    width: 100%;
  }
  .icon-wrap {
    width: 80px; height: 80px;
    background: rgba(34,197,94,0.1);
    border: 1px solid rgba(34,197,94,0.25);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    font-size: 36px;
  }
  h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
  p  { font-size: 14px; color: #64748b; line-height: 1.7; margin-bottom: 28px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: #22c55e; color: #000;
    font-weight: 700; font-size: 14px;
    padding: 13px 28px; border-radius: 12px;
    border: none; cursor: pointer;
    width: 100%; justify-content: center;
    transition: opacity .2s;
  }
  .btn:active { opacity: .8; }
  .logo {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: 32px;
  }
  .logo img { width: 36px; height: 36px; border-radius: 8px; }
  .logo span { font-size: 14px; font-weight: 700; color: #94a3b8; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="/icons/icon-192.svg" alt="Canchas">
    <span>Canchas El Campeón</span>
  </div>
  <div class="icon-wrap">📶</div>
  <h1>Sin conexión</h1>
  <p>No hay internet disponible. Necesitas conexión para ver canchas y gestionar reservas. Revisa tu Wi-Fi o datos móviles y vuelve a intentar.</p>
  <button class="btn" onclick="location.reload()">↺ &nbsp;Reintentar conexión</button>
</div>
</body>
</html>

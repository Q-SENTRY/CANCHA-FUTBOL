<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </radialGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  <circle cx="96" cy="88" r="56" fill="url(#ball)"/>
  <!-- Football pentagon pattern -->
  <polygon points="96,48 118,63 110,88 82,88 74,63" fill="#166534" opacity="0.6"/>
  <line x1="96" y1="48" x2="74" y2="63"  stroke="#14532d" stroke-width="1.5" opacity="0.7"/>
  <line x1="96" y1="48" x2="118" y2="63" stroke="#14532d" stroke-width="1.5" opacity="0.7"/>
  <line x1="74" y1="63" x2="82" y2="88"  stroke="#14532d" stroke-width="1.5" opacity="0.7"/>
  <line x1="118" y1="63" x2="110" y2="88" stroke="#14532d" stroke-width="1.5" opacity="0.7"/>
  <line x1="82" y1="88" x2="110" y2="88" stroke="#14532d" stroke-width="1.5" opacity="0.7"/>
  <!-- Outer stitching -->
  <circle cx="96" cy="88" r="56" fill="none" stroke="#166534" stroke-width="2" opacity="0.5"/>
  <!-- C letter -->
  <text x="96" y="107" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="52" fill="white" opacity="0.9">C</text>
  <!-- CANCHAS label -->
  <text x="96" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#4ade80" letter-spacing="3">CANCHAS</text>
</svg>

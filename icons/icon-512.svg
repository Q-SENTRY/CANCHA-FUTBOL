<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </radialGradient>
  </defs>
  <!-- Full bleed background (maskable — safe zone is inner 80%) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- Content within safe zone (51px–461px) -->
  <circle cx="256" cy="220" r="140" fill="rgba(0,0,0,0.18)"/>
  <!-- Football pattern -->
  <polygon points="256,115 311,152 291,212 221,212 201,152" fill="rgba(0,0,0,0.25)"/>
  <circle cx="256" cy="220" r="140" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  <!-- C letter -->
  <text x="256" y="280" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="160" fill="white" opacity="0.95">C</text>
  <!-- CANCHAS label -->
  <text x="256" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="38" fill="rgba(255,255,255,0.85)" letter-spacing="10">CANCHAS</text>
  <!-- Tagline -->
  <text x="256" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-weight="400" font-size="22" fill="rgba(255,255,255,0.5)" letter-spacing="3">EL CAMPEÓN</text>
</svg>
